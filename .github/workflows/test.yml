name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Student forks: next.py sees GitHub Actions. It writes the progress
  # table on the run's summary page and runs the tests of every day the
  # student has started, so a finished day shows a green check.
  check:
    if: github.event.repository.fork
    runs-on: ubuntu-24.04
    name: tests and progress
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Progress table and tests of the started days
        run: python next.py

  # Course repository: the starter files are meant to fail, so only check
  # that every test file loads without errors.
  course-check:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect all tests
        run: pytest --collect-only
